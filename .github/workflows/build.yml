name: build-dex
on:
  workflow_dispatch:
  push:
    paths: ['src/**', '.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build DEX
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PLAT=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "platform=$PLAT build-tools=$BT"
          mkdir -p out/classes
          javac --release 8 -cp "$PLAT/android.jar" -d out/classes $(find src -name '*.java')
          "$BT/d8" --release --min-api 26 --lib "$PLAT/android.jar" --output out $(find out/classes -name '*.class')
          python3 -c "import zlib,base64;d=open('out/classes.dex','rb').read();open('dex_base64.txt','w').write(base64.b64encode(zlib.compress(d,9)).decode())"
      - name: Save result
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add dex_base64.txt
          git commit -m "build result" || echo "nothing to commit"
          git push
